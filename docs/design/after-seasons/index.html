<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Season 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="preview.css">
<style>
/* After Season 2 (brainstorm A + C): a list card on the map, Bloq's tour of the streak, today's quest and Missions, and a safe "Play again from zero". Real Bloq, real jump. */
:root {
  --night: #131f33; --navy: #16243a; --navy-soft: #23344f; --navy-2: #22324c; --ivory: #f7f4eb; --lime: #d4f033; --lime-d: #a6c21a;
  --lav: #c9b8ec; --lavender: #c9a6f3; --lavender-soft: #efe7fb; --purple: #8b45d9; --purple-d: #6630b3; --coral: #f5a58b; --card: #fffdf7; --border: #ddd8c9; --muted-fg: #4f5b6e;
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --font-display: var(--display); --font-sans: var(--body); --font-mono: var(--mono);
  --app-bg: radial-gradient(circle at 80% 10%, rgb(185 178 239 / .25), transparent 50%), radial-gradient(circle at 10% 90%, rgb(199 243 107 / .12), transparent 45%), var(--navy);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ivory); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; padding: 28px 16px 72px; overflow-x: hidden; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; overflow-x: clip; padding: 10px; }
.top h1 { margin: 0; font: 600 26px/1.15 var(--display); letter-spacing: -.02em; }
.top p { margin: 8px 0 0; color: var(--lav); max-width: 100ch; }
.top b { color: var(--ivory); }
h2.sec { margin: 18px 0 0; font: 600 20px/1.25 var(--display); }
.controls { display: flex; gap: 10px; }
.ghost { border: 0; cursor: pointer; min-height: 40px; padding: 0 16px; border-radius: 999px; font: 600 13.5px/1 var(--display); background: transparent; color: var(--lav); box-shadow: inset 0 0 0 1.5px rgb(201 184 236 / .5); }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
.tag { display: inline-grid; place-items: center; height: 30px; padding: 0 12px; border-radius: 999px; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--lime); color: var(--navy); justify-self: start; }
.demos { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 30px; align-items: start; }
@media (max-width: 1100px) { .demos { grid-template-columns: minmax(0, 1fr); } }
.demos > section { display: grid; gap: 10px; min-width: 0; justify-items: start; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.how > div { background: var(--navy-2); border-radius: 16px; padding: 14px 18px; }
.how h3 { margin: 0 0 4px; font: 600 15px/1.3 var(--display); }
.how p { margin: 0; color: var(--lav); font-size: 14px; }

/* frames */
.ph-frame { position: relative; width: 390px; max-width: 100%; height: 844px; border-radius: 40px; overflow: hidden; background: var(--app-bg); box-shadow: 0 0 0 10px #0b1220, 0 30px 60px rgb(0 0 0 / .5); }
.ph-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px 130px; scrollbar-width: none; }
.ph-scroll::-webkit-scrollbar { display: none; }
.dk-frame { position: relative; display: grid; grid-template-columns: 200px minmax(0, 1fr); width: 1000px; max-width: 100%; height: 844px; border-radius: 24px; overflow: hidden; background: var(--app-bg); box-shadow: 0 0 0 1px rgb(255 255 255 / .06), 0 24px 50px rgb(0 0 0 / .35); }
.dk-scroll { position: relative; overflow-y: auto; padding: 24px 32px 60px; min-width: 0; }
.rail { padding: 26px 16px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid rgb(255 255 255 / .06); }
.rail-logo { margin: 0 0 18px 12px; font: 600 22px/1 var(--display); }
.rail-tab { position: relative; border: 0; background: transparent; text-align: left; height: 46px; padding: 0 16px; border-radius: 14px; color: var(--lavender); font: 500 15px/1 var(--display); cursor: pointer; }
.rail-tab.on { background: var(--lime); color: var(--navy); }
.rail-tab.glow, .tab.glow { color: var(--lime); box-shadow: inset 0 0 0 1.5px var(--lime); animation: glow 1.6s ease-in-out infinite; }
.rail-tab .new { margin-left: 8px; padding: 2px 7px; border-radius: 999px; background: var(--lime); color: var(--navy); font: 700 10px/1.4 var(--mono); font-style: normal; text-transform: uppercase; }
@keyframes glow { 0%, 100% { box-shadow: inset 0 0 0 1.5px var(--lime), 0 0 0 0 rgb(212 240 51 / .45); } 50% { box-shadow: inset 0 0 0 1.5px var(--lime), 0 0 0 6px rgb(212 240 51 / 0); } }

/* page */
.pg { position: relative; }
.a-host { position: absolute; left: 0; top: 0; z-index: 5; width: 86px; cursor: pointer; }
.door { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--navy-2); border: 1.5px solid var(--lime); }
.door b { display: block; font: 500 15px/1.3 var(--display); }
.door small { color: var(--ivory); font-size: 12.5px; }
.g-ico { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgb(212 240 51 / .12); color: var(--lime); font: 700 15px/1 var(--display); }
.pill-out { margin-left: auto; min-height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; color: var(--lime); box-shadow: inset 0 0 0 1.5px var(--lime); font: 600 12px/1 var(--display); white-space: nowrap; }

.list { margin-top: 100px; border-radius: 1.6rem; background: var(--navy-soft); border: 1px solid rgb(247 244 235 / .1); padding: 20px; box-shadow: 0 20px 44px -18px rgb(0 0 0 / .4); transition: box-shadow .3s; }
.list.done { box-shadow: 0 0 0 1.5px var(--lime), 0 20px 44px -18px rgb(0 0 0 / .4); }
.l-eb { margin: 0; font: 600 11px/1.5 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--lime); }
.l-h { margin: 4px 0 0; font: 500 22px/1.15 var(--display); letter-spacing: -.02em; }
.list ul { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.list li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 40px; font-size: 14px; color: var(--ivory); }
.list li.ok .lbl { color: var(--lav); }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed rgb(201 166 243 / .5); font: 700 12px/1 var(--display); }
.list li.ok .dot { border: 0; background: var(--lime); color: var(--navy); }
.tick { color: var(--lime); font-weight: 700; }
.lnk { border: 0; background: none; cursor: pointer; color: var(--lime); font: 600 13px/1 var(--display); min-height: 40px; padding: 0 2px; }
.l-foot { margin: 12px 0 0; font-size: 13px; color: var(--lav); }
.again { margin-top: 10px; border: 0; background: none; cursor: pointer; padding: 0; min-height: 40px; color: var(--lavender); font: 600 13.5px/1 var(--display); text-decoration: underline; text-underline-offset: 4px; }

.cards { display: grid; gap: 100px; margin-top: 112px; }
.dk-scroll .cards { grid-template-columns: 1fr 1fr; gap: 16px; }
.streak, .daily { border-radius: 1.6rem; padding: 20px; transition: box-shadow .3s; }
.streak { background: var(--ivory); color: var(--navy); box-shadow: 0 20px 44px -18px rgb(0 0 0 / .4); }
.daily { background: var(--navy-soft); border: 1px solid rgb(247 244 235 / .1); }
.streak.lit, .daily.lit { box-shadow: 0 0 0 2px var(--lime), 0 0 26px rgb(212 240 51 / .22); }
.s-eb { margin: 0; font: 600 11px/1.5 var(--body); letter-spacing: .18em; text-transform: uppercase; color: rgb(22 36 58 / .6); }
.s-num { margin: 4px 0 0; display: flex; align-items: baseline; gap: 8px; font: 500 18px/1 var(--display); }
.s-num b { font: 600 46px/1 var(--display); }
.best { margin-left: auto; padding: 4px 10px; border-radius: 999px; background: rgb(201 166 243 / .5); font: 500 12px/1 var(--body); }
.bar { margin-top: 16px; height: 6px; border-radius: 999px; background: rgb(22 36 58 / .1); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lime); border-radius: 999px; transition: width .6s cubic-bezier(.22,1,.36,1); }
.s-txt { margin: 8px 0 0; font-size: 14px; }
.s-sub { margin: 0; font-size: 12px; color: rgb(22 36 58 / .6); }
.b-lime { margin-top: 14px; width: 100%; min-height: 46px; border: 0; border-radius: 999px; background: var(--lime); color: var(--navy); font: 600 15px/1 var(--display); cursor: pointer; }
.pulse { animation: lv-pulse 1.8s ease-in-out infinite; }
@keyframes lv-pulse { 0%,100% { box-shadow: 0 0 0 0 rgb(212 240 51 / .6); } 50% { box-shadow: 0 0 0 7px rgb(212 240 51 / 0); } }
.checked { margin-top: 14px; min-height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 2px solid var(--lime); background: rgb(212 240 51 / .2); font: 600 15px/1 var(--display); }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.d-eb { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 11px/1.5 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--lavender); }
.d-eb i { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }
.chip { max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: rgb(201 166 243 / .2); color: var(--lavender); font-size: 11px; }
.d-h { margin: 8px 0 0; font: 500 24px/1 var(--display); text-transform: uppercase; letter-spacing: -.03em; }
.d-c { margin: 8px 0 0; font-size: 14px; color: rgb(247 244 235 / .8); }
.rew { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.rew span { padding: 8px 12px; border-radius: 999px; font: 600 13px/1 var(--body); }
.r1 { background: var(--navy); color: var(--lime); } .r2 { background: var(--lavender-soft); color: var(--navy); }
.b-lime.wide { margin-top: 16px; }
.d-done { margin: 16px 0 0; min-height: 44px; display: flex; align-items: center; color: var(--lime); font-weight: 600; font-size: 14px; }
.d-by { margin: 12px 0 0; font-size: 12px; color: var(--lavender); }

/* bottom menu (phone) */
.bnav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 0 16px 16px; }
.pill { display: flex; flex: 1; min-width: 0; justify-content: space-around; border-radius: 999px; border: 1px solid rgb(247 244 235 / .1); background: rgb(35 52 79 / .95); padding: 4px; }
.tab { position: relative; flex: 1; min-width: 0; min-height: 46px; border: 0; background: transparent; border-radius: 999px; color: var(--lavender); font: 600 9px/1.2 var(--body); text-transform: uppercase; cursor: pointer; }
.tab.on { background: var(--lime); color: var(--navy); }
.tab .new { position: absolute; top: 5px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 2px var(--navy-soft); }
.dock { width: 62px; height: 62px; flex: none; border-radius: 50%; background: var(--navy-soft); box-shadow: inset 0 0 0 2px rgb(212 240 51 / .25); }

/* toast, sheet, reset */
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; max-width: 90%; padding: 9px 14px; border-radius: 999px; background: var(--lime); color: var(--navy); font: 600 12.5px/1.2 var(--display); text-align: center; box-shadow: 0 14px 30px rgb(0 0 0 / .35); }
.sheet-wrap { position: absolute; inset: 0; z-index: 70; display: flex; align-items: flex-end; }
.sheet-wrap.desk { align-items: center; justify-content: center; }
.scrim { position: absolute; inset: 0; border: 0; background: rgb(22 36 58 / .6); cursor: pointer; }
.sheet { position: relative; width: 100%; background: var(--ivory); color: var(--navy); border-radius: 2rem 2rem 0 0; padding: 10px 22px 26px; box-shadow: 0 -20px 50px rgb(0 0 0 / .35); }
.desk .sheet { width: 460px; border-radius: 28px; padding: 26px 26px 24px; }
.grab { display: block; width: 48px; height: 6px; margin: 4px auto 14px; border-radius: 999px; background: rgb(22 36 58 / .15); }
.sh-eb { margin: 0; font: 600 11px/1.5 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted-fg); }
.sh-h { margin: 4px 0 0; font: 500 26px/1.1 var(--display); letter-spacing: -.03em; }
.sh-p { margin: 10px 0 0; font-size: 14.5px; line-height: 1.5; color: rgb(22 36 58 / .8); }
.keyrow { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
.keybox { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 16px; background: #ece8dc; padding: 12px; font: 13px var(--mono); }
.copy { border: 0; cursor: pointer; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--navy); color: var(--ivory); font: 600 14px/1 var(--display); }
.check { margin-top: 12px; display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--navy); }
.sh-btns { margin-top: 10px; display: grid; gap: 10px; }
.b-navy { min-height: 50px; border: 0; border-radius: 999px; background: var(--navy); color: var(--lime); font: 600 15px/1 var(--display); cursor: pointer; }
.b-navy:disabled { opacity: .4; cursor: default; }
.b-ghost { min-height: 50px; border: 0; border-radius: 999px; background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px rgb(22 36 58 / .2); font: 600 15px/1 var(--display); cursor: pointer; }
.reset { position: absolute; inset: 0; z-index: 80; display: grid; place-content: center; gap: 10px; padding: 30px; text-align: center; background: rgb(19 31 51 / .94); }
.r-h { margin: 0; font: 600 20px/1.2 var(--display); }
.r-p { margin: 0; color: var(--lav); font-size: 14px; max-width: 34ch; }
.reset .b-lime { width: auto; padding: 0 22px; justify-self: center; }

/* Bloq's bubble beside him (styles.css hop-say) */
.bloq-say.hop-say { left: auto; right: 74px; bottom: 34%; max-width: 168px; font-size: 13px; line-height: 1.4; padding: 10px 13px; --ox: 100%; }
.bloq-say.hop-say::after { bottom: 16px; left: auto; right: -7px; transform: rotate(-45deg); }
.dk-scroll .bloq-say.hop-say { right: 88px; max-width: 230px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="preview.js"></script>
</body>
</html>
