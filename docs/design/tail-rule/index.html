<style>
/* Nov 9 afternoon: the bubble tail rule, and "Wrong answer" over the quiz on desktop. Real Bloq, real map (today's code and the rule). */
:root {
  --night: #131f33; --navy: #16243a; --navy-soft: #23344f; --navy-2: #22324c; --ivory: #f7f4eb; --lime: #d4f033; --lime-d: #a6c21a;

  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ivory); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.top h1 { margin: 0; font: 600 26px/1.15 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.top p { margin: 8px 0 0; color: var(--lav); max-width: 95ch; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.act { border: 0; cursor: pointer; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--lime); color: var(--navy); font: 600 14px/1 var(--display); }
.var { display: grid; gap: 10px; min-width: 0; padding-top: 14px; border-top: 1px solid rgb(247 244 235 / .08); }

.tag { display: inline-grid; place-items: center; min-width: 30px; height: 28px; padding: 0 10px; border-radius: 999px; font: 700 11.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--navy-2); color: var(--lavender); }
.tag.new { background: var(--lime); color: var(--navy); }
.vb { margin: 0; color: var(--lav); font-size: 14px; }

/* the scaled desktop */
.fit { position: relative; width: 100%; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgb(255 255 255 / .07), 0 24px 50px rgb(0 0 0 / .35); }

.logo { position: relative; padding-left: 52px; height: 44px; display: flex; align-items: center; }

.logo i:nth-child(1) { top: 2px; width: 32px; } .logo i:nth-child(2) { top: 16px; width: 38px; background: var(--lime-d); } .logo i:nth-child(3) { top: 30px; }
.logo b { font: 600 25px/1 var(--display); letter-spacing: -.02em; }
.rail nav { display: grid; gap: 8px; }

.mapbg .b1 { left: 14%; top: 22%; } .mapbg .b2 { left: 36%; top: 8%; }
.side { position: absolute; right: 0; top: 0; bottom: 0; width: 330px; padding: 28px 26px; display: grid; align-content: start; gap: 12px; background: #16243a; }
.live { margin: 0; font: 600 12px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--lav); }
.live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--lime); }
.live.dim::before { display: none; }

.tx { padding: 12px 16px; border-radius: 16px; background: #1b2a43; } .tx b { display: block; font: 500 15px/1.3 var(--display); } .tx small { font: 500 11px/1.4 var(--mono); color: var(--lav); }
.backdrop { position: absolute; inset: 0; background: rgb(22 36 58 / .5); }
.card { position: absolute; height: 676px; padding: 30px 30px 20px; border-radius: 28px; background: var(--ivory); color: var(--navy); box-shadow: 0 30px 60px rgb(0 0 0 / .4); }
.cbloq { position: absolute; right: 68px; top: 0; width: 104px; transform: translateY(-74%); z-index: 2; }

.chips { display: flex; gap: 8px; margin: 18px 0 0; }
.chips span { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--lavender-soft); font: 600 14px/1 var(--body); }
.chips span.g { background: var(--lime); }
.near { margin-top: 24px; padding: 22px; border-radius: 24px; background: var(--navy); color: var(--ivory); }
.near h5 { margin: 0; font: 500 18px/1.2 var(--display); color: var(--lime); } .near p { margin: 10px 0 0; font-size: 14px; color: rgb(247 244 235 / .8); } .near span { display: inline-block; margin-top: 10px; font: 600 14px/1 var(--display); color: var(--lime); }
/* the bag (prompt 27): same look and slide as on the map */
.bag { position: absolute; z-index: 5; top: 0; transform: translateY(-110%); transition: transform .4s cubic-bezier(.22,1,.36,1); }
.bag.in { transform: translateY(10px); }
.ibar { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 20px; background: #1d2c47; box-shadow: 0 0 0 1.5px rgb(212 240 51 / .6), 0 16px 30px rgb(0 0 0 / .5); }
.gchip, .ichip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; font: 600 16px/1 var(--display); transition: transform .3s, box-shadow .3s; }
.gchip { background: var(--navy); color: var(--ivory); }
.items { margin-left: auto; display: flex; gap: 6px; }

.qq { margin: 18px 0 10px; font: 500 19px/1.35 var(--display); }
.opt { display: flex; justify-content: space-between; align-items: center; min-height: 54px; margin-top: 10px; padding: 0 22px; border-radius: 18px; border: 2px solid rgb(22 36 58 / .1); background: var(--card); font: 600 16px/1 var(--body); }

.opt i { font: 600 11px/1 var(--display); font-style: normal; color: #5b6476; }
.checking { margin: 14px 0 0; font: 600 13px/1 var(--body); color: #5b6476; }
/* "Working on it…" (AppChrome) */
.busy { position: absolute; z-index: 8; top: 12px; display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 12px; border-radius: 999px; background: var(--navy); color: var(--ivory); font: 500 15px/1 var(--body); white-space: nowrap; box-shadow: 0 12px 28px rgb(0 0 0 / .4); transform: translate(-50%, -12px); opacity: 0; transition: transform .35s, opacity .35s; }
.busy.in { transform: translate(-50%, 0); opacity: 1; }
.busy .mk { position: relative; width: 22px; height: 20px; }
.busy .mk i { position: absolute; left: 0; height: 5.5px; border-radius: 4px; background: var(--lime); }
.busy .mk i:nth-child(1) { top: 1px; width: 16px; } .busy .mk i:nth-child(2) { top: 7.5px; width: 19px; background: var(--lime-d); } .busy .mk i:nth-child(3) { top: 14px; width: 22px; }
.edge.mid { height: 70px; border-left-color: rgb(212 240 51 / .6); }

.pair { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.pair .var { flex: 1 1 700px; border-top: 0; padding-top: 0; }
.var-head h3 { margin: 0; font: 600 16px/1.25 var(--display); }
/* the map column (desktop width) with the Season 1 trail and the Season 2 card, as on the map */
.mapcol { width: 100%; max-width: 724px; padding: 28px 28px 20px; border-radius: 22px; background: radial-gradient(circle at 80% 10%, rgb(185 178 239 / .25), transparent 50%), var(--navy); box-shadow: 0 0 0 1px rgb(255 255 255 / .06); }
@media (max-width: 520px) { .mapcol { padding: 16px 12px 20px; } }
.mt { margin-top: 16px; }
.door-p { margin: 0; font-size: 14px; color: var(--lavender); }
.shopbtn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--lime); color: var(--navy); font: 600 15px/1 var(--body); }
/* Lovable's season rows (styles.css), including the rule that moves the bubble left while the Season 2 card has a button */
.season-map { container-type: inline-size; min-width: 0; }
.scard { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-width: 0; border: 1.5px solid rgb(247 244 235 / .14); border-radius: 1.1rem; background: linear-gradient(90deg, #23344f, #1f2d47); }
.scard.season-2 { margin-top: 64px; background: linear-gradient(90deg, #23344f, #2c2058); }
.scard.open { border-color: var(--lime); box-shadow: 0 0 22px rgb(212 240 51 / .09); }
.g-ico { width: 30px; height: 30px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgb(212 240 51 / .12); color: var(--lime); font: 700 15px/1 var(--display); }
.g-txt { flex: 1; min-width: 0; }
.g-txt .eb { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--lime); font: 600 10.5px/1.5 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.season-2 .eb { color: #e8beff; }
.g-txt b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 15.5px/1.5 var(--display); color: var(--ivory); }
.scard:has(.g-btn) .g-txt b { width: calc(100% - 76px); }
.season-map:has(.g-btn) > .bloq-trail-wrap .walker .bloq-say { left: auto; right: 58px; --ox: 100%; }
.g-btn { flex: none; min-height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 0 14px; font: 600 12px/1 var(--display); }
.g-btn.graduate-first { background: transparent; color: var(--lime); box-shadow: inset 0 0 0 1.5px var(--lime); }
/* 2: the quiz with "Wrong answer" */
.s2bar { position: absolute; left: 28px; right: 28px; top: 30px; display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 18px; border: 1.5px solid var(--lime); background: linear-gradient(90deg, #23344f, #2c2058); }
.s2bar small { display: block; font: 600 11px/1.5 var(--display); letter-spacing: .16em; text-transform: uppercase; color: #e8beff; } .s2bar b { font: 500 17px/1.4 var(--display); }
.content .mapbg { top: 130px; }
.cbloq .rel { position: relative; }
.card h3 { margin-top: 6px; }
.opt.wrong { border-color: #f5a58b; background: rgb(245 165 139 / .2); color: rgb(22 36 58 / .7); text-decoration: line-through; text-decoration-color: #f5a58b; }

.hint b { display: block; margin-top: 8px; font: 600 13px/1 var(--display); }

.toast.in { transform: translate(-50%, 0); opacity: 1; }

.pills { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }

.pillx .ck { font-size: 14px; }
.pillx .mk { position: relative; width: 22px; height: 20px; }
.pillx .mk i { position: absolute; left: 0; height: 5.5px; border-radius: 4px; background: var(--lime); }
.pillx .mk i:nth-child(1) { top: 1px; width: 16px; } .pillx .mk i:nth-child(2) { top: 7.5px; width: 19px; background: var(--lime-d); } .pillx .mk i:nth-child(3) { top: 14px; width: 22px; }
.content.shop { padding: 34px 28px; }
.sh-eb { margin: 0; font: 600 11px/1.5 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--lime); }
.sh-h { margin: 6px 0 0; font: 500 28px/1.15 var(--display); letter-spacing: -.03em; }
