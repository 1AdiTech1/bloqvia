<title>Bloq's Wardrobe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="preview.css">
<style>
/* Bloq's wardrobe: every hat, prop, outfit and pose of the real <Bloq/> (src/bloq), with a dress-up stage. */
:root {
  --night: #131f33; --navy: #16243a; --navy-soft: #23344f; --navy-2: #22324c; --ivory: #f7f4eb; --lime: #d4f033; --lime-d: #a6c21a;
  --lav: #c9b8ec; --lavender: #c9a6f3; --lavender-soft: #efe7fb; --card: #fffdf7;
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ivory); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--night); }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.top h1 { margin: 0; font: 600 30px/1.15 var(--display); letter-spacing: -.02em; }
.top p { margin: 8px 0 0; color: var(--lav); max-width: 90ch; }
.sec { display: grid; gap: 14px; min-width: 0; padding-top: 18px; border-top: 1px solid rgb(247 244 235 / .08); }
.sec h2 { margin: 0; font: 600 21px/1.2 var(--display); }
.sec h2 small { margin-left: 8px; padding: 3px 9px; border-radius: 999px; background: var(--navy-2); color: var(--lavender); font: 700 12px/1 var(--mono); vertical-align: middle; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

/* the stage */
.stage-wrap { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .stage-wrap { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; height: 420px; border-radius: 26px; overflow: hidden; background: radial-gradient(circle at 70% 18%, rgb(185 178 239 / .28), transparent 55%), radial-gradient(circle at 15% 90%, rgb(199 243 107 / .14), transparent 45%), var(--navy); box-shadow: 0 0 0 1px rgb(255 255 255 / .07), 0 24px 50px rgb(0 0 0 / .35); }
.stage .floor { position: absolute; left: 10%; right: 10%; bottom: 46px; height: 24px; border-radius: 50%; background: radial-gradient(rgb(0 0 0 / .35), transparent 70%); }
.star-bloq { position: absolute; left: 30%; bottom: 52px; width: 190px; transform: translateX(-50%); }
.panel { display: grid; gap: 12px; min-width: 0; }
.chips, .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cl { width: 56px; flex: none; font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--lav); }
.chips button, .acts button { border: 0; cursor: pointer; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--navy-2); color: var(--ivory); font: 500 13px/1 var(--display); }
.chips button:hover, .acts button:hover { background: #2c3e5c; }
.chips button.on, .acts button.on { background: var(--lime); color: var(--navy); }
.acts button { background: transparent; box-shadow: inset 0 0 0 1.5px rgb(212 240 51 / .6); color: var(--lime); }
@media (max-width: 520px) { .cl { width: 100%; } }

/* the grids */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.card { margin: 0; display: grid; grid-template-rows: auto 1fr; border-radius: 20px; overflow: hidden; background: var(--navy-soft); box-shadow: 0 0 0 1px rgb(255 255 255 / .06); }
.pic { display: grid; place-items: end center; height: 190px; padding: 16px 0 12px; background: radial-gradient(circle at 50% 30%, rgb(185 178 239 / .2), transparent 60%), var(--navy); }
.grid.small .pic { height: 160px; }
.pic > * { width: 112px; }
.grid.small .pic > * { width: 96px; }
figcaption { display: grid; gap: 4px; align-content: start; padding: 12px 14px 14px; }
figcaption b { font: 600 15px/1.25 var(--display); }
figcaption code { font: 500 11.5px/1.3 var(--mono); color: var(--lime); }
figcaption ul { margin: 6px 0 0; padding-left: 16px; display: grid; gap: 3px; font-size: 12.5px; line-height: 1.35; color: var(--lav); }
figcaption .spare { margin: 6px 0 0; font-size: 12.5px; color: rgb(201 184 236 / .6); }
</style>
<div id="root"></div>
<script src="preview.js"></script>
