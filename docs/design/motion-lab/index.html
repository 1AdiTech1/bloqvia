/* Bloq Motion Lab (Phase 0 of the motion programme, Nov 9): every move Bloq makes, slowed down, framed and scored. */
:root {
  --night: #131f33; --navy: #16243a; --navy-soft: #23344f; --navy-2: #22324c; --ivory: #f7f4eb; --lime: #d4f033; --lime-d: #a6c21a;

  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--ivory); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: hidden; }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }

/* toolbar: a sticky bar under the title */

  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 27px; background: rgb(0 0 0 / .2); border-top: 1px solid rgb(247 244 235 / .1);
}

.cube.c0 { background: var(--lime); } .cube.c1 { background: var(--lavender); } .cube.c2 { background: #8fd3ff; }

em[aria-label] { font-style: normal; color: var(--lav); margin-left: 6px; font-size: 13px; }
.rank em.to { margin-left: 6px; }
.rule-list { margin: 0; padding: 0; list-style: none; counter-reset: r; display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }

.st { flex: none; padding: 3px 8px; border-radius: 999px; font: 700 10.5px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.st-shipped { background: var(--s5); color: var(--navy); }

.aud { display: grid; gap: 8px; min-width: 0; }

.tl { display: grid; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--navy); box-shadow: inset 0 0 0 1px rgb(212 240 51 / .25); min-width: 0; }
